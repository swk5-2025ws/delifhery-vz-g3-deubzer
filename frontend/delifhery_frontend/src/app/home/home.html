<div class="home_container">
  <div class="text_wrapper">
   <div class="text_container">
    <div class="text1">
      <a>Fast & Reliable Parcel Shipping</a>
      <a class="small_text">DeliFHery makes it easy to ship, track, and manage your packages from anywhere.</a>
    </div>
     <div class="text_button_container">
       <button class="text_button" routerLink="/shippingCost">Calculate Shipping Cost</button>
     </div>
   </div>
  </div>
  <div class="track_wrapper">
      <div class="track_container">
        <a class="text">Track Your Shipment</a>
        <div class="tracK_bg_container">
          <input type="text" class="track_input" placeholder="Tracking number... " [(ngModel)] = "trackingNumber">
          <input type="text" class="track_input" placeholder="Postal code..." [(ngModel)]="postalCode">
          <button class="track_button" (click)="OnTrack()" [disabled]="loading"> {{ loading ? 'Loading...' : 'Track' }}</button>
        </div>
        @if (error) { <p class="error">{{ error }}</p> }
      </div>
    </div>
</div>
