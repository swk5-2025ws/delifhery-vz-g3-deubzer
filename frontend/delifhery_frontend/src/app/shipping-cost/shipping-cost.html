<div class="shipping_cost_wrapper">
  <div class="shipping_cost_container">
      <a class="text1">Calculate the Shipping Costs</a>
    <div class="shipping_cost_info_container">
      <div class="shipping_cost_info">
      <a class="text2">From</a>
        <div class="input_container">
          <input class="shipping_input" placeholder="postal code...">
          <input class="shipping_input" placeholder="city...">
          <input class="shipping_input" placeholder="address...">
          <input class="shipping_input" placeholder="hNr...">
        </div>
      </div>
      <div class="shipping_cost_info">
        <a class="text2">To</a>
        <div class="input_container">
          <input class="shipping_input" placeholder="postal code...">
          <input class="shipping_input" placeholder="city...">
          <input class="shipping_input" placeholder="address...">
          <input class="shipping_input" placeholder="hNr...">
        </div>
      </div>
    </div>
    <a class="text1 secondText1">Box Size</a>
    <div class="shipping_cost_weight_container">
      <div class="shipping_cost_weight">
        <div class="width">
          <a class="text3">Width:</a>
          <input type="number" class="shipping_input" placeholder="cm...">
        </div>
        <div class="height">
          <a class="text3">Height:</a>
          <input type="number" class="shipping_input" placeholder="cm...">
        </div>
        <div class="weight">
          <a class="text3">Length:</a>
          <input type="number" class="shipping_input" placeholder="cmd...">
        </div>
        <div class="weight">
          <a class="text3">Weight:</a>
          <input type="number" class="shipping_input" placeholder="kg...">
        </div>
      </div>
      <div class="shipping_cost_button">
        <button class="shipping_button">Calculate</button>
      </div>
    </div>
  </div>
</div>
