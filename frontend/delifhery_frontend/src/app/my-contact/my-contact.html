<div class="contact_wrapper">
  <div class="contacts_container">
    <div class="text_container">
      <a class="text1">My Contacts</a>
      <a class="text2">Manage your email addresses and phone numbers.</a>
    </div>
    <div class="search_bar_container">
    <input type="text" placeholder="Search contacts" class="search_bar">
    </div>
    <div class="my_contacts_list">

    </div>
  </div>
  <div class="add_new_contact_container">
    <div class="add_new_text_container">
      <a class="text1">Add new</a>
    </div>
    <div class="choose_container">
      <form>

      </form>
    </div>
    <ng-template>
      <div class="input_fields_email">
        <input type="text" class="email_input" placeholder="Email address">
        <input type="text" class="email_input" placeholder="Label">
      </div>
    </ng-template>
    <ng-template>
      <div class="input_fields_phone">
        <input type="text" class="phone_input" placeholder="Phone number ">
        <input type="text" class="phone_input" placeholder="Label">
      </div>
    </ng-template>
    <div class="button_container">
      <div class="save_primary">
        <input type="checkbox">
        <a class="text2">Save as primary email address.</a>
      </div>
      <button class="save_button">Save</button>
    </div>
  </div>
</div>
