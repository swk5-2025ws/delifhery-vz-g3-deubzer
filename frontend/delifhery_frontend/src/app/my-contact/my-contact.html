<div class="contact_wrapper">
  <div class="contacts_container">
    <div class="text_container">
      <a class="text1">My Contacts</a>
      <a class="text2">Manage your email addresses and phone numbers.</a>
    </div>
    <div class="search_bar_container">
      <img ngSrc="/icons/search.svg" width="25" height="25" alt="Search Icon" class="search_image">
      <input type="text" placeholder="Search contacts" class="search_bar">
    </div>
    <div class="my_contacts_list">

    </div>
  </div>
  <div class="add_new_contact_container">
    <div class="add_new_text_container">
      <a class="text1">Add new</a>
    </div>
    <div class="choose_container_wrapper">
      <form class="choose_container">
        <label>
          <input
            type="radio"
            name="contactType"
            value="email"
            class="email_radio"
            [(ngModel)] = "selectedType"
          />
          Email
        </label>
        <label>
          <input
            type="radio"
            name="contactType"
            value="phone"
            class="phone_radio"
            [(ngModel)]="selectedType"/>
          Phone
        </label>
      </form>
    </div>
    <ng-container
      [ngTemplateOutlet]="selectedType === 'email' ? emailTemplate : phoneTemplate"
    >
    </ng-container>
    <ng-template #emailTemplate >
      <div class="input_fields_email">
        <input type="text" class="email_input" placeholder="Email address">
        <input type="text" class="email_input" placeholder="Label (optional)">
      </div>
    </ng-template>
    <ng-template #phoneTemplate>
      <div class="input_fields_email">
        <input type="text" class="email_input" placeholder="Phone number ">
        <input type="text" class="email_input" placeholder="Label (optional)">
      </div>
    </ng-template>
    <div class="button_container">
      <div class="save_primary">
        <input type="checkbox" class="big_checkbox">
        <a class="text2">Save as primary contact method.</a>
      </div>
      <button class="save_button">Save</button>
    </div>
  </div>
</div>
