<div class="header_container">
  <div class="image_container">
    <img
      ngSrc="/images/delifherylogo.png"
      width="200"
      height="200"
      alt="DeliFHery Logo"
      routerLink="home"
      routerLinkActive="active"
    />
  </div>
  <div class="text_container">
    <a routerLink="shippingCost" routerLinkActive="active" class="item font_family">Shipping Cost</a>
    <a routerLink="sendPackage" routerLinkActive="active" class="item font_family">Send Package</a>
    <a routerLink="tracking" routerLinkActive="active" class="item font_family">Tracking</a>
    <a routerLink="myContacts" routerLinkActive="active" class="item font_family">My Contacts</a>
  </div>
  <div class="login_button_container">
    <button class="login_button font_family">Login</button>
    <button class="signUp_button font_family">Sign Up</button>

</div>
