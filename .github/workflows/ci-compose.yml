name: CI (docker compose)
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

      - name: Create .env for compose
        run: | 
            cat > .env << 'EOF'
            Sa_Password=${{ secrets.SA_PASSWORD }}
            KC_ADMIN=${{ secrets.KC_ADMIN }}
            KC_ADMIN_PASSWORD=${{ secrets.KC_ADMIN_PASSWORD }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EOF

      - name: Build images
        run: docker compose --env-file .env -f docker/compose.yml build

      - name: Wait for backend to be ready
        run: |
          # adjust endpoint if you have /health
          for i in {1..60}; do
            if curl -fsS http://localhost:7156/swagger >/dev/null 2>&1; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready in time"
          docker compose -f docker/docker-compose.yml logs backend
          exit 1

      - name: Smoke test - call API
        run: |
          curl -fsS http://localhost:7156/swagger >/dev/null
          echo "OK"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f docker/compose.yml down